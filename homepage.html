<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="browserlogo.png">
    <!-- Set web app capable -->
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Set status bar style (optional) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Set the app title when added to Home Screen -->
    <meta name="apple-mobile-web-app-title" content="FRC Betting">

    <!-- App icon (optional but recommended) -->
    <link rel="apple-touch-icon" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRC Betting Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
    <style>

        @keyframes stripeSlide {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: -28.28px 28.28px;
            }
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: 'Roboto', sans-serif;
            background-color: #343a40;
            color: white;
            line-height: 1.6;
        }



        header {
            background-color: #212529;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
        }

        header p {
            margin-top: 10px;
            font-size: 1.2rem;
        }

        .token-info {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #ddd;
            padding: 10px 20px;
            background-color: #5b5b5b;
            border-radius: 5px;
            display: inline-block;
        }

        main {
            padding: 20px;
            text-align: center;
        }

        .competition-selection {
            background-color: #5b5b5b;
            background-image: repeating-linear-gradient(
                45deg,
                #5b5b5b,
                #5b5b5b 10px,
                #4e4e4e 10px,
                #4e4e4e 20px
            );
            background-size: 28.28px 28.28px;
            animation: stripeSlide 4s linear infinite;

            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }


        .competition-selection h2 {
            font-size: 1.8rem;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            margin: 0 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1rem;
            transition: transform 0.2s ease-in-out;
        }

        .tab-btn.active {
            background-color: #0056b3;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .search-input {
            width: 80%;
            max-width: 400px;
            padding: 10px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            text-align: center;
        }

        #region-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .region-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            text-align: center;
            padding: 15px;
            font-size: 1.5rem;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            margin: 10px auto;
            transition: transform 0.2s ease-in-out;
        }

        .region-btn:hover, .tab-btn:hover {
            transform: scale(1.1);
        }

        .region-btn:hover {
            background-color: #0056b3;
        }

        footer {
            background-color: #212529;
            padding: 10px;
            text-align: center;
            position: fixed;
            width: 100%;
            bottom: 0;
        }

        @media (max-width: 768px) {
            .tabs {
                flex-direction: column; /* Stack the tab buttons vertically on smaller screens */
                align-items: center; /* Center align the tab buttons */
            }

            .tab-btn {
                width: 100%; /* Make each tab button take up full width */
                margin: 5px 0; /* Space between buttons */
                padding: 12px; /* Make buttons more tappable */
            }
        }

    </style>
</head>
<body>
    <header>
        <h1>Welcome to FRC Betting</h1>
        <p>Place your bets on FRC competition scores!</p>
        <!-- Token Display -->
        <div class="token-info" id="token-display"></div>
    </header>

    <main>
        <section class="competition-selection">
            <h2>Select Your Competition Region</h2>
            <!-- Tabs to switch between Active, Past, and Upcoming Competitions -->
            <div class="tabs">
                <button class="tab-btn active" onclick="openTab('active')">Active Competitions</button>
                <button class="tab-btn" onclick="openTab('past')">Past Competitions</button>
                <button class="tab-btn" onclick="openTab('upcoming')">Upcoming Competitions</button>
                <button class="tab-btn" onclick="openTab('leaderboard')">Leaderboard</button>
            </div>

            <!-- Content for Active Competitions -->
            <div id="active" class="tab-content active">
                <div class="search-box">
                    <input type="text" id="search-active" class="search-input" placeholder="Search for an active competition...">
                </div>
                <div id="active-region-buttons"><p>Loading active competitions...</p></div>
            </div>

            <!-- Content for Past Competitions -->
            <div id="past" class="tab-content">
                <div class="search-box">
                    <input type="text" id="search-past" class="search-input" placeholder="Search for a past competition...">
                </div>
                <div id="past-region-buttons"><p>Loading past competitions...</p></div>
            </div>

            <!-- Content for Upcoming Competitions -->
            <div id="upcoming" class="tab-content">
                <div class="search-box">
                    <input type="text" id="search-upcoming" class="search-input" placeholder="Search for an upcoming competition...">
                </div>
                <div id="upcoming-region-buttons"><p>Loading upcoming competitions...</p></div>
            </div>
        </section>
        <!-- Content for Leaderboard -->
            <div id="leaderboard" class="tab-content">
                <section class="competition-selection" style="margin-top: 40px; margin-bottom: 40px;">
                <h3 style="margin: 20px 0;">Top Token Holders</h3>
                <ul id="leaderboard-list" style="list-style: none; padding: 0;"></ul>
                </section>
            </div>
        <section class="competition-selection" style="margin-top: 40px; margin-bottom: 40px;">
            <h2>Redeem a Code</h2>
            <div>
                <input type="text" id="redeem-code-input" placeholder="Enter your code..." class="search-input" style="max-width: 300px;">
                <button onclick="redeemCode()" class="tab-btn" style="margin-top: 10px;">Redeem</button>
                <p id="redeem-message" style="margin-top: 10px; color: #ffc107;"></p>
            </div>
        </section>        
    </main>

    <footer>
        <p>2025 FRC Betting. NOT ASSOCIATED WITH FRC.</p>
    </footer>

    <script>
        const apiKey = '4LGtwcoqrW5HYCVKHzrWGbMdfVirzVrMGmPFL4Mk7d1pCt6s7AjIaixPqLCEU9MN';
        const currentDate = new Date().toISOString().split('T')[0];
        const activeRegionButtons = document.getElementById('active-region-buttons');
        const pastRegionButtons = document.getElementById('past-region-buttons');
        const upcomingRegionButtons = document.getElementById('upcoming-region-buttons');
        const searchActive = document.getElementById('search-active');
        const searchPast = document.getElementById('search-past');
        const searchUpcoming = document.getElementById('search-upcoming');

        let eventsList = [];

        fetch(`https://www.thebluealliance.com/api/v3/events/${new Date().getFullYear()}`, {
            headers: { 'X-TBA-Auth-Key': apiKey }
        })
        .then(response => response.json())
        .then(events => {
            eventsList = events;
            filterAndDisplayEvents('active'); // Default to active events
        })
        .catch(error => {
            console.error('Error fetching events:', error);
            activeRegionButtons.innerHTML = '<p>Unable to load competitions.</p>';
        });

        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(button => button.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.querySelector(`button[onclick="openTab('${tabName}')"]`).classList.add('active');
            filterAndDisplayEvents(tabName); // Filter and display events for the active tab
            if (tabName === 'leaderboard') {
                updateLeaderboard();
            }
        }

        function filterAndDisplayEvents(tab) {
            let filteredEvents;
            if (tab === 'active') {
                filteredEvents = eventsList.filter(event => event.start_date <= currentDate && event.end_date >= currentDate);
                displayEvents(filteredEvents, activeRegionButtons);
            } else if (tab === 'past') {
                filteredEvents = eventsList.filter(event => event.end_date < currentDate);
                displayEvents(filteredEvents, pastRegionButtons);
            } else if (tab === 'upcoming') {
                filteredEvents = eventsList.filter(event => event.start_date > currentDate);
                displayEvents(filteredEvents, upcomingRegionButtons);
            }
        }

        function displayEvents(events, container) {
            container.innerHTML = '';
            if (events.length > 0) {
                events.forEach(event => {
                    const eventElement = document.createElement('a');
                    eventElement.href = `templatepage.html?event_code=${event.key}`;
                    eventElement.className = 'region-btn';

                    const startDate = new Date(event.start_date).toLocaleDateString('en-US');
                    const endDate = new Date(event.end_date).toLocaleDateString('en-US');
                    eventElement.innerHTML = `
                        <strong>${event.name}</strong><br>
                        <span style="font-size: 1rem;">${startDate} - ${endDate}</span>
                    `;

                    container.appendChild(eventElement);
                });
            } else {
                container.innerHTML = '<p>No competitions available.</p>';
            }
        }

        // Search functionality for each tab
        searchActive.addEventListener('input', () => searchAndFilter('active'));
        searchPast.addEventListener('input', () => searchAndFilter('past'));
        searchUpcoming.addEventListener('input', () => searchAndFilter('upcoming'));

        function searchAndFilter(tab) {
            const searchTerm = tab === 'active' ? searchActive.value.toLowerCase() :
                               tab === 'past' ? searchPast.value.toLowerCase() :
                               searchUpcoming.value.toLowerCase();
            let filteredEvents = eventsList.filter(event => event.name.toLowerCase().includes(searchTerm));

            // Reapply tab filtering after search
            if (tab === 'active') {
                filteredEvents = filteredEvents.filter(event => event.start_date <= currentDate && event.end_date >= currentDate);
                displayEvents(filteredEvents, activeRegionButtons);
            } else if (tab === 'past') {
                filteredEvents = filteredEvents.filter(event => event.end_date < currentDate);
                displayEvents(filteredEvents, pastRegionButtons);
            } else if (tab === 'upcoming') {
                filteredEvents = filteredEvents.filter(event => event.start_date > currentDate);
                displayEvents(filteredEvents, upcomingRegionButtons);
            }
        }

        // Display token directly on homepage
        const tokenDisplay = document.getElementById('token-display');
        const tokens = localStorage.getItem('tokens') || 0;
        tokenDisplay.textContent = `Your Tokens: ${tokens}`;

        // Sample redeem codes - you can modify or load from a server eventually
        const redeemCodes = {
            "FRC100": { tokens: 100, expires: "2025-06-01" },
            "EXTRABOOST": { tokens: 50, expires: null }, // null = no expiration
            "APRIL2025": { tokens: 150, expires: "2025-04-30" },
            "BEARBOTICS": { tokens: 300, expires: "2025-12-30" },
            "SUPERSECRETCODE": { tokens: 300, expires: null },
            "ONLYTHESIGMASKNOW": { tokens: 300, expires: null }
        };

        function redeemCode() {
            const input = document.getElementById('redeem-code-input').value.trim().toUpperCase();
            const message = document.getElementById('redeem-message');

            if (!input || !redeemCodes[input]) {
                message.textContent = "Invalid code.";
                message.style.color = "red";
                return;
            }

            const codeData = redeemCodes[input];

            // Check if code is expired
            if (codeData.expires && new Date() > new Date(codeData.expires)) {
                message.textContent = "Code expired.";
                message.style.color = "red";
                return;
            }

            // Check if already redeemed
            const usedCodes = JSON.parse(localStorage.getItem("redeemedCodes") || "[]");
            if (usedCodes.includes(input)) {
                message.textContent = "Code already redeemed.";
                message.style.color = "red";
                return;
            }

            // Grant tokens
            let currentTokens = parseInt(localStorage.getItem('tokens') || "0");
            currentTokens += codeData.tokens;
            localStorage.setItem('tokens', currentTokens);
            tokenDisplay.textContent = `Your Tokens: ${currentTokens}`;

            // Mark code as used
            usedCodes.push(input);
            localStorage.setItem("redeemedCodes", JSON.stringify(usedCodes));

            message.textContent = `Success! You received ${codeData.tokens} tokens.`;
            message.style.color = "#28a745"; // Green

            document.getElementById('redeem-code-input').value = "";
        }
        const sampleUsers = [
            { name: "The leaderboard tab is currently a WIP", tokens: 850 },
            { name: "In the mean time, here's a preview on how it will work!", tokens: 740 },
            { name: "(Why are you still reading?)", tokens: 620 }
        ];

        function updateLeaderboard() {
            const currentUserTokens = parseInt(localStorage.getItem('tokens') || "0");
            const currentUser = { name: "You", tokens: currentUserTokens };

            // Merge and sort
            const leaderboard = [currentUser, ...sampleUsers]
                .sort((a, b) => b.tokens - a.tokens);

            const list = document.getElementById('leaderboard-list');
            list.innerHTML = "";

            leaderboard.forEach((user, index) => {
                const item = document.createElement('li');
                item.innerHTML = `
                    <span style="font-weight: bold;">#${index + 1}:</span> 
                    ${user.name} – <span style="color: #ffc107;">${user.tokens} tokens</span>
                `;
                item.style.marginBottom = "10px";
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
