<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Predicted Match Score</title>
  <style>

/* Scrollable container for the match stats */
.match-stats-container {
  max-height: 400px; /* Adjust the height as needed */
  overflow-y: auto; /* Enable vertical scrolling */
  padding-right: 10px; /* Prevent content from touching the scroll bar */
  scrollbar-width: thin; /* Make the scrollbar thinner */
  scrollbar-color: #888 #f1f1f1; /* Style the scrollbar (color for thumb and track) */
}

/* Optional: Styling for the scrollbar on Webkit browsers (Chrome, Safari) */
.match-stats-container::-webkit-scrollbar {
  width: 8px;
}

.match-stats-container::-webkit-scrollbar-thumb {
  background-color: #888;
  border-radius: 10px;
}

.match-stats-container::-webkit-scrollbar-track {
  background-color: #f1f1f1;
}

/* Styling for match stats */
.match-stats {
  margin-bottom: 20px;
  padding: 15px;
  border-radius: 10px;
  background-color: #575757; /* Light grey background for the entire match box */
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

/* Red Alliance Box (Pastel Red) */
.red-team {
  background-color: rgba(255, 99, 71, 0.2); /* Pastel red */
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.red-team strong {
  color: #ff9090; /* Darker red for the strong text */
}

/* Blue Alliance Box (Pastel Blue) */
.blue-team {
  background-color: rgba(70, 130, 180, 0.2); /* Pastel blue */
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.blue-team strong {
  color: #8ac5ff; /* Darker blue for the strong text */
}

/* Styling for opponent info */
.opponent-info {
  margin-top: 10px;
  font-style: italic;
}

h4 {
  font-size: 1.2em;
  font-weight: bold;
  color: #cbcbcb;
}

p {
  font-size: 1em;
  color: #555;
}

    /* Add new modal styling */
    .team-info-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .team-info-modal.show {
    display: flex;
    animation: fadeInFromBottom 0.5s forwards;
  }

  .team-info-modal.hide {
    animation: fadeOutToBottom 0.5s forwards;
  }

  /* Fade-in from the bottom animation */
  @keyframes fadeInFromBottom {
    0% {
      opacity: 0;
      transform: translateY(20px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Fade-out to the bottom animation */
  @keyframes fadeOutToBottom {
    0% {
      opacity: 1;
      transform: translateY(0);
    }
    100% {
      opacity: 0;
      transform: translateY(20px);
    }
  }

  .modal-content {
    background: #333;
    padding: 20px;
    border-radius: 10px;
    width: 60%;
    max-width: 800px;
    color: white;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1.5em;
    margin-bottom: 10px;
  }

  .close-modal {
    cursor: pointer;
    font-size: 1.2em;
    background: #dc3545;
    padding: 5px 10px;
    border-radius: 5px;
  }

    /* Existing styles */
    .tba-button { background-color: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 5px; margin-top: 10px; cursor: pointer; font-size: 0.9em; }
    .tba-button:hover { background-color: #0056b3; }
    .box-container { background-color: #2c3034; padding: 15px; border-radius: 8px; margin-top: 20px; color: #e0e0e0; }
    header { background-color: #212529; padding: 20px; text-align: center; border-radius: 20px; }
    :root { --bg-color: #343a40; --text-color: white; --card-bg: #495057; --input-bg: #6c757d; --btn-color: #007bff; --btn-hover: #0056b3; }
    body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 40px 20px; }
    .container { display: flex; gap: 20px; align-items: flex-start; }
    .score-box { border: 5px solid #595959; border-radius: 12px; padding: 15px; margin-top: 20px; max-width: 400px; cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .score-box:hover { transform: scale(1.03); box-shadow: 0 0 10px rgba(0,0,0,0.2); }
    .red { background-color: #ff6060; }
    .blue { background-color: #7b9eff; }
    h2 { margin-bottom: 5px; }
    .team-cards { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; max-width: 350px; opacity: 0; transform: translateX(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
    .team-cards.visible { opacity: 1; transform: translateX(0); }
    .team-cards.fade-out { opacity: 0; transform: translateX(20px); }
    .team-card {
      border: 2px dashed #888;
      border-radius: 12px;
      padding: 10px 15px;
      background-color: var(--card-bg);
      cursor: pointer; /* Add this line to change the cursor to a pointer when hovering */
    }
    .team-info { display: flex; flex-direction: column; }
    .team-number { font-weight: bold; font-size: 1.1em; color: #c3c3c3; }
    .team-name { font-size: 0.95em; font-weight: bold; color: #c3c3c3; }
    .back-btn { display: block; margin: 20px auto; padding: 10px; background: #dc3545; color: white; text-decoration: none; border-radius: 5px; width: 200px; text-align: center; }
    .back-btn:hover { background: #c82333; }
  </style>
</head>
<body>
  <header>
    <h1>Predicted Score for Match</h1>
    <a class="back-btn" href="homepage.html">Back to Main Page</a>
  </header>
  <div class="box-container">
    <p>
      <strong style="font-size: 1.5em; text-align: center; display: block; color:white">Select An Alliance To View More Info</strong>
      <!-- Existing explanation content -->
    </p>
    <div id="results"></div>
    <div id="teamInfo" class="team-cards"></div>
  </div>

  <!-- Modal for Team Info -->
  <div id="team-info-modal" class="team-info-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="team-name-header"></span>
        <span class="close-modal" onclick="closeModal()">&times;</span>
      </div>
      <div id="team-stats"></div>
    </div>
  </div>

  <script>
    function getParameterByName(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    const TBA_AUTH_KEY = '4LGtwcoqrW5HYCVKHzrWGbMdfVirzVrMGmPFL4Mk7d1pCt6s7AjIaixPqLCEU9MN';

    // Function to open a new window with team details
    function openTeamDetails(teamKey) {
      // Remove 'frc' prefix to get the team number
      const teamNumber = teamKey.replace('frc', '');
      const url = `https://www.thebluealliance.com/team/${teamNumber}`;
      window.open(url, '_blank');
    }

    async function showTeamStats(teamKey) {
  const teamNumber = teamKey.replace('frc', '');  // Extract the team number

  // Request team info
  const url = `https://www.thebluealliance.com/api/v3/team/${teamKey}`;
  const teamRes = await fetch(url, {
    headers: { 'X-TBA-Auth-Key': TBA_AUTH_KEY }
  });

  if (!teamRes.ok) {
    // If the request fails, show an error
    alert('Failed to load team data.');
    return;
  }

  const teamData = await teamRes.json();
  const teamName = teamData.nickname || "Unknown Name";
  const teamCity = teamData.city || "N/A";
  const teamCountry = teamData.country || "N/A";
  const rookieYear = teamData.rookie_year || "N/A";

  // Get the team's match performance
  const matchStats = await getTeamMatchStats(teamKey);

  const teamStats = `
    <h3>Team Key: ${teamKey}</h3>
    <ul>
      <li><strong>Location:</strong> ${teamCity}</li>
      <li><strong>Region:</strong> ${teamCountry}</li>
      <li><strong>Rookie Year:</strong> ${rookieYear}</li>
    </ul>
    <h4>Recent Performance:</h4>
    <ul>
      ${matchStats}
    </ul>
  `;

  // Update the modal content with team stats
  document.getElementById('team-stats').innerHTML = teamStats;
  document.getElementById('team-name-header').textContent = `Team ${teamNumber} - ${teamName}`;

  // Show the modal with fade-in animation
  const modal = document.getElementById('team-info-modal');
  modal.classList.remove('hide'); // Ensure fade-out animation is removed
  modal.classList.add('show');
}

function getEventKeyFromMatchId() {
  const matchId = getParameterByName('matchId')
  // Split the matchId at the underscore and return the first part
  return matchId.split('_')[0];
}

// Function to get and format match data for the team during a specific event
async function getTeamMatchStats(teamKey, matchData) {
  const eventKey = getEventKeyFromMatchId(); // Extract event key from match data
  const nowUnix = Math.floor(Date.now() / 1000); // Current time in Unix format
  const matchStats = [];

  try {
    // Fetch the team's past matches during the event
    const teamMatchesRes = await fetch(`https://www.thebluealliance.com/api/v3/team/${teamKey}/event/${eventKey}/matches/simple`, {
      method: 'GET',
      headers: { 'X-TBA-Auth-Key': TBA_AUTH_KEY }
    });

    if (!teamMatchesRes.ok) throw new Error("Failed to load team match data.");

    const matches = await teamMatchesRes.json();
    const pastMatches = matches.filter(m => m.actual_time && m.actual_time < nowUnix); // Filter for past matches
    const sortedMatches = pastMatches.sort((a, b) => b.actual_time - a.actual_time).slice(0, 5); // Get the 5 most recent matches

    // Format the match data
    sortedMatches.forEach(match => {
      const teamAlliance = match.alliances.red.team_keys.includes(teamKey) ? 'red' : 'blue';
      const score = match.alliances[teamAlliance].score;
      const opponent = teamAlliance === 'red' ? match.alliances.blue.team_keys : match.alliances.red.team_keys;
      
      // Extract match type and number
      const matchType = match.comp_level; // E.g., "qm" for qualification match
      const matchNumber = match.match_number;

      // Remove "frc" from the team numbers
      const opponentTeams = opponent.map(team => team.replace('frc', ''));

      matchStats.push(`
        <div class="match-stats">
          <h4>Match ${matchType.toUpperCase()} ${matchNumber}</h4>
          <p><strong>Event:</strong> ${match.event_key}</p>
          <div class="match-details">
            <div class="team red-team">
              <strong>Red Alliance:</strong><br>
              ${match.alliances.red.team_keys.map(team => team.replace('frc', '')).join(', ')}<br>
              <strong>Score:</strong> ${match.alliances.red.score}
            </div>
            <div class="team blue-team">
              <strong>Blue Alliance:</strong><br>
              ${match.alliances.blue.team_keys.map(team => team.replace('frc', '')).join(', ')}<br>
              <strong>Score:</strong> ${match.alliances.blue.score}
            </div>
          </div>
          <div class="opponent-info">
            <strong>Opponent(s):</strong> ${opponentTeams.join(', ')}
          </div>
        </div>
      `);
    });

    // If no matches were found, return a placeholder message
    return `<div class="match-stats-container">${matchStats.length ? matchStats.join('') : "<div>No recent matches found for this event.</div>"}</div>`;
  } catch (err) {
    return `<div class="error-message">Error loading match data: ${err.message}</div>`;
  }
}


function closeModal() {
  const modal = document.getElementById('team-info-modal');
  modal.classList.remove('show'); // Ensure fade-in animation is removed
  modal.classList.add('hide'); // Trigger fade-out animation

  // Optionally, hide the modal entirely after the animation ends
  modal.addEventListener('animationend', () => {
    if (modal.classList.contains('hide')) {
      modal.style.display = 'none'; // Hide modal after the fade-out animation
    }
  });
}

    async function predictScores() {
      const matchKey = getParameterByName('matchId');
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = "Loading...";
      const nowUnix = Math.floor(Date.now() / 1000);

      try {
        const matchRes = await fetch(`https://www.thebluealliance.com/api/v3/match/${matchKey}`, {
          headers: { 'X-TBA-Auth-Key': TBA_AUTH_KEY }
        });
        if (!matchRes.ok) throw new Error("Invalid match key or match not found.");
        const matchData = await matchRes.json();

        const eventKey = matchData.event_key;
        const year = matchKey.substring(0, 4);
        const alliances = matchData.alliances;

        let redScores = [];
        let blueScores = [];

        for (const color of ['red', 'blue']) {
          for (const teamKey of alliances[color].team_keys) {
            let scores = [];

            const eventMatchesRes = await fetch(`https://www.thebluealliance.com/api/v3/team/${teamKey}/event/${eventKey}/matches/simple`, {
              headers: { 'X-TBA-Auth-Key': TBA_AUTH_KEY }
            });

            if (eventMatchesRes.ok) {
              const matches = await eventMatchesRes.json();
              const past = matches.filter(m => m.actual_time && m.actual_time < nowUnix);
              const sorted = past.sort((a, b) => b.actual_time - a.actual_time).slice(0, 3);

              for (const match of sorted) {
                const teamAlliance = match.alliances.red.team_keys.includes(teamKey) ? 'red' : 'blue';
                scores.push(match.alliances[teamAlliance].score);
              }
            }

            if (scores.length < 3) {
              const seasonMatchesRes = await fetch(`https://www.thebluealliance.com/api/v3/team/${teamKey}/matches/${year}/simple`, {
                headers: { 'X-TBA-Auth-Key': TBA_AUTH_KEY }
              });

              if (seasonMatchesRes.ok) {
                const matches = await seasonMatchesRes.json();
                const past = matches.filter(m => m.actual_time && m.actual_time < nowUnix);
                const sorted = past.sort((a, b) => b.actual_time - a.actual_time);

                for (const match of sorted) {
                  if (scores.length >= 3) break;
                  const teamAlliance = match.alliances.red.team_keys.includes(teamKey) ? 'red' : 'blue';
                  scores.push(match.alliances[teamAlliance].score);
                }
              }
            }

            if (color === 'red') redScores.push(...scores);
            else blueScores.push(...scores);
          }
        }

        const avgRed = redScores.length ? (redScores.reduce((a, b) => a + b) / redScores.length).toFixed(1) : "N/A";
        const avgBlue = blueScores.length ? (blueScores.reduce((a, b) => a + b) / blueScores.length).toFixed(1) : "N/A";

        resultsDiv.innerHTML = `
          <a class="back-btn" href="templatepage2.html?match_id=${matchKey}">Back to Match Page</a>
          <div class="score-box red" onclick="showTeams('red')">
            <h2>Red Alliance Prediction:</h2>
            <strong>Avg Score:</strong> ${avgRed}
          </div>
          <div class="score-box blue" onclick="showTeams('blue')">
            <h2>Blue Alliance Prediction:</h2>
            <strong>Avg Score:</strong> ${avgBlue}
          </div>
        `;

        window.allianceTeamKeys = alliances;

      } catch (err) {
        resultsDiv.innerHTML = `Error: ${err.message}`;
      }
    }

    async function showTeams(color) {
      const teamInfoDiv = document.getElementById('teamInfo');

      // Animate out
      if (teamInfoDiv.classList.contains('visible')) {
        teamInfoDiv.classList.remove('visible');
        teamInfoDiv.classList.add('fade-out');
        await new Promise(resolve => setTimeout(resolve, 500));
      }

      const teams = window.allianceTeamKeys[color].team_keys;

      const teamCards = await Promise.all(teams.map(async (teamKey) => {
        const teamNumber = teamKey.replace('frc', '');

        const teamRes = await fetch(`https://www.thebluealliance.com/api/v3/team/${teamKey}`, {
          headers: { 'X-TBA-Auth-Key': TBA_AUTH_KEY }
        });
        const teamData = await teamRes.json();
        const teamName = teamData.nickname || "Unknown Name";

        return `
          <div class="team-card" data-team-key="${teamKey}" onclick="showTeamStats('${teamKey}')">
            <div class="team-info">
              <div class="team-number">Team ${teamNumber}</div>
              <div class="team-name">${teamName}</div>
              <button class="tba-button" onclick="openTeamDetails('${teamKey}')">Go to TBA</button>
            </div>
          </div>
        `;
      }));

      teamInfoDiv.innerHTML = teamCards.join('');
      teamInfoDiv.classList.remove('fade-out');
      teamInfoDiv.classList.add('visible');
    }

    predictScores();
  </script>
</body>
</html>
