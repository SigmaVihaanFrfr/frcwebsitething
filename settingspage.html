<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - FRC Betting</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        @keyframes stripeSlide {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: -28.28px 28.28px;
            }
        }

        @keyframes otherStripeSlide {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 56.56px 28.28px;
            }
        }


        input[type="text"], select {
            width: 100%;
            padding: 14px 16px; /* Increased padding */
            margin-top: 4px;
            margin-bottom: 12px; /* Added bottom margin for better spacing */
            margin-right: 12px;
            font-size: 1rem;
            border-radius: 8px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: none;
            outline: none;
        }
        :root {
            --bg-color: #343a40;
            --text-color: white;
            --card-bg: #495057;
            --input-bg: #6c757d;
            --btn-color: #007bff;
            --btn-hover: #0056b3;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .settings-container {
            background-color: #5b5b5b;
            background-image: repeating-linear-gradient(
                45deg,
                #5b5b5b,
                #5b5b5b 10px,
                #4e4e4e 10px,
                #4e4e4e 20px
            );
            background-size: 28.28px 28.28px;
            animation: stripeSlide 4s linear infinite;

            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .settings-header {
            background-color: #5b5b5b;
            background-image: repeating-linear-gradient(
                45deg,
                #5b5b5b,
                #5b5b5b 10px,
                #4e4e4e 10px,
                #4e4e4e 20px
            );
            background-size: 28.28px 28.28px;
            animation: otherStripeSlide 4s linear infinite;

            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .settings-option {
            margin-bottom: 20px;
        }

        label {
            font-weight: 500;
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: none;
            outline: none;
        }

        .checkbox {
            transform: scale(1.2);
            margin-right: 8px;
        }

        .btn {
            padding: 10px 20px;
            background-color: var(--btn-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--btn-hover);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .back-button {
            margin-top: 30px;
            background-color: gray;
        }
    </style>
</head>
<body>
    <div class="settings-header">
        <h1>Settings</h1>
    </div>
    <div class="settings-container">
        <div class="settings-option">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username" style="margin-left: -10px;">
        </div>

        <div class="settings-option">
            <label for="deviceID">Device ID</label>
            <input type="text" id="deviceID" placeholder="Auto-generated if empty" style="margin-left: -10px;">
        </div>        

        <div class="settings-option">
            <label for="favTeam">Favorite Team Number</label>
            <input type="text" id="favTeam" placeholder="e.g., 2358" style="margin-left: -10px;">
        </div>

        <div class="settings-option">
            <label>
                <input type="checkbox" id="notifications" class="checkbox">
                Enable Match Notifications
            </label>
        </div>

        <div class="settings-option btn-group">
            <button class="btn" onclick="saveSettings()">Save Settings</button>
            <button class="btn" onclick="resetSettings()">Reset All</button>
            <button class="btn" onclick="loadUserDataFromSheet()">Load Data</button>
            <button class="btn" href="leaderboard.html">Save Data</button>
        </div>

        <button class="btn back-button" onclick="location.href='homepage.html'">Back to Homepage</button>
    </div>

    <script>
        const usernameInput = document.getElementById('username');
        const favTeamInput = document.getElementById('favTeam');
        const notificationsCheckbox = document.getElementById('notifications');
        const deviceIDInput = document.getElementById('deviceID');
    
        // Generate a new deviceID if not present
        function generateDeviceID() {
            return 'device-' + Math.random().toString(36).substr(2, 9);
        }
    
        // Load saved settings
        window.onload = () => {
            usernameInput.value = localStorage.getItem('username') || '';
            favTeamInput.value = localStorage.getItem('favTeam') || '';
            notificationsCheckbox.checked = localStorage.getItem('notifications') === 'true';
    
            const storedDeviceID = localStorage.getItem('deviceID') || generateDeviceID();
            localStorage.setItem('deviceID', storedDeviceID);
            deviceIDInput.value = storedDeviceID;
        };
    
        function saveSettings() {
            localStorage.setItem('username', usernameInput.value);
            localStorage.setItem('favTeam', favTeamInput.value);
            localStorage.setItem('notifications', notificationsCheckbox.checked);
    
            const newDeviceID = deviceIDInput.value.trim();
            if (newDeviceID) {
                localStorage.setItem('deviceID', newDeviceID);
            }
    
            alert('Settings saved!');
        }
    
        function resetSettings() {
            if (confirm("Are you sure you want to reset all settings?")) {
                localStorage.removeItem('username');
                localStorage.removeItem('favTeam');
                localStorage.removeItem('notifications');
                localStorage.removeItem('deviceID');
                location.reload();
            }
        }

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxSKKEEYW2TB1NXuDdKx5bNGstwka4VDOIfNPH5DsxYNa38HKyaTTFeeNPrX2AA5CVOVA/exec';

        async function loadUserDataFromSheet() {
            const storedDeviceID = localStorage.getItem('deviceID');
            if (!storedDeviceID) {
                alert("No device ID found. Please save your settings first.");
                return;
            }

            try {
                const res = await fetch(SCRIPT_URL);
                const users = await res.json();

                const user = users.find(u => u["Device ID"] === storedDeviceID);
                if (user) {
                    if (user["Name"]) {
                        localStorage.setItem('username', user["Name"]);
                        usernameInput.value = user["Name"];
                    }
                    if (user["Tokens"] !== undefined) {
                        localStorage.setItem('tokens', user["Tokens"]);
                    }

                    alert("Data loaded from Google Sheet!");
                } else {
                    alert("No user found in sheet with this Device ID.");
                }
            } catch (error) {
                console.error("Error loading data:", error);
                alert("Failed to load data from Google Sheet.");
            }
        }
    </script>    
</body>
</html>
