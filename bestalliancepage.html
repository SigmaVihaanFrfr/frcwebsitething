        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #212529;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
            opacity: 1; /* start fully visible */
        }
        
        .fade-in-appear {
          opacity: 0;
          display: flex; /* force it to be shown again */
          pointer-events: all;
        }

        .fade-in-appear.show {
          opacity: 1;
          transition: opacity 0.5s ease;
        }

        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        .fade-in {
          opacity: 0;
          transition: opacity 1s ease;
        }
        .fade-in.show {
          opacity: 1;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #343a40;
            color: white;
            margin: 0;
            padding: 40px 20px;

        header {
            background-color: #212529;
            padding: 20px;

            border-radius: 20px;
        }

        h1 {
            color: #cbcbcb;
        }

        .box-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            background-color: #2c3034;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;

        .team-card {
            background-color: #575757;

            padding: 20px;
            text-align: center;
            width: 200px;
            height: 200px;

            flex-direction: column;

            color: white;

            transform: scale(0.95);

            to {
                opacity: 1;
                transform: scale(1);
            }

        .fade-out {
            animation: fadeOut 0.4s ease forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(0.9);
            }

        .team-card button {
            background: #dc3545;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: background 0.3s ease;

            align-items: center;
            z-index: 1000;

            max-height: 70vh; /* Add this line to limit the height */

        window.addEventListener('load', () => {

                setTimeout(() => {
                    loadingScreen.style.display = 'none'; // hide after fade
                }, 500); // match your CSS transition duration (0.5s)
            }, 500); // Optional slight delay before starting fade-out
        });

        function navigateWithLoading(targetPage) {
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.style.display = 'flex'; // show loading screen
            loadingScreen.style.opacity = '0'; // start transparent

            // Force reflow
            void loadingScreen.offsetWidth;

            loadingScreen.style.opacity = '1'; // fade in

            setTimeout(() => {
                window.location.href = targetPage;
            }, 600); // slightly longer than your fade-in transition
        }

    <script>
        const apiKey = '4LGtwcoqrW5HYCVKHzrWGbMdfVirzVrMGmPFL4Mk7d1pCt6s7AjIaixPqLCEU9MN';
        const selectedAlliance = [];
        let currentDraftOptions = [];

        async function loadTopTeams() {
    const topTeamsList = document.getElementById('teams');
    topTeamsList.innerHTML = '<div>Loading top teams...</div>';

    try {
        const response = await fetch('https://www.thebluealliance.com/api/v3/events/2025/simple', {
            headers: { 'X-TBA-Auth-Key': apiKey }
        });

        const events = await response.json();
        if (!events.length) throw new Error('No events found.');

        const rankings = [];
        const selectedEvents = events.slice(0, 5);

        for (const event of selectedEvents) {
            const rankingRes = await fetch(`https://www.thebluealliance.com/api/v3/event/${event.key}/rankings`, {
                headers: { 'X-TBA-Auth-Key': apiKey }
            });
            const rankingData = await rankingRes.json();

            if (rankingData.rankings) {
                rankingData.rankings.forEach(r => {
                    rankings.push({
                        team_key: r.team_key,
                        rank: r.rank, // Add rank here
                        qualPoints: r.extra_stats ? r.extra_stats[0] : r.sort_orders?.[0] || 0
                    });
                });
            }
        }

        const teamStats = {};
        rankings.forEach(({ team_key, qualPoints }) => {
            if (!teamStats[team_key]) teamStats[team_key] = 0;
            teamStats[team_key] += qualPoints;
        });

        const allSortedTeams = Object.entries(teamStats).sort((a, b) => b[1] - a[1]);
        const top100 = allSortedTeams.slice(0, 100);

        const teamDetailMap = {};
const topTeamDetails = await Promise.all(top100.map(async ([teamKey]) => {
    const teamRes = await fetch(`https://www.thebluealliance.com/api/v3/team/${teamKey}`, {
        headers: { 'X-TBA-Auth-Key': apiKey }
    });
    const teamData = await teamRes.json();
    const rankData = rankings.find(r => r.team_key === teamKey);

    // Fetch last 5 matches
    const matchRes = await fetch(`https://www.thebluealliance.com/api/v3/team/${teamKey}/matches/2025/simple`, {
        headers: { 'X-TBA-Auth-Key': apiKey }
    });
    const matches = await matchRes.json();
    const nowUnix = Math.floor(Date.now() / 1000);
    const pastMatches = matches.filter(m => m.actual_time && m.actual_time < nowUnix);
    const last5 = pastMatches.sort((a, b) => b.actual_time - a.actual_time).slice(0, 5);

    let totalScore = 0;
    last5.forEach(match => {
        const allianceColor = match.alliances.red.team_keys.includes(teamKey) ? 'red' : 'blue';
        totalScore += match.alliances[allianceColor].score || 0;
    });

    const avgScore = last5.length ? totalScore / last5.length : 0;

    const combinedData = {
        ...teamData,
        teamKey,
        rank: rankData ? rankData.rank : 'N/A',
        avgScore
    };
    teamDetailMap[teamKey] = combinedData;
    return combinedData;
}));

// Now sort by average score from last 5 matches
const finalSortedTeams = topTeamDetails.sort((a, b) => b.avgScore - a.avgScore);

window.allTopTeams = finalSortedTeams;
draftNextTeam();

        window.allTopTeams = topTeamDetails;
        draftNextTeam();

    } catch (error) {
        console.error('Error loading top teams:', error);
        topTeamsList.innerHTML = '<div>Error loading teams. Please try again later.</div>';
    }
}

function draftNextTeam() {
    const topTeamsList = document.getElementById('teams');
    topTeamsList.innerHTML = '';

    const pool = [...window.allTopTeams];
    currentDraftOptions = [];

    while (currentDraftOptions.length < 3) {
        const randomIndex = Math.floor(Math.random() * pool.length);
        const randomTeam = pool[randomIndex];
        if (!selectedAlliance.some(t => t.team_number === randomTeam.team_number) &&
            !currentDraftOptions.includes(randomTeam)) {
            currentDraftOptions.push(randomTeam);
        }
    }

    currentDraftOptions.forEach((team, index) => {
        const rankingIndex = window.allTopTeams.findIndex(t => t.teamKey === team.teamKey) + 1;

        const teamCard = document.createElement('div');
        teamCard.className = 'team-card';
        teamCard.innerHTML = `
            <strong>${team.nickname || `Team ${team.team_number}`}</strong> (Team ${team.team_number})
            <p><strong>Avg Score:</strong> ${team.avgScore.toFixed(1)}</p>
            <p><strong>Rank:</strong> #${rankingIndex}</p>
            <button class="select-team-btn" data-index="${index}">Select Team</button>
            <button onclick="showTeamStats('${team.teamKey}')">Show Match Stats</button>
        `;
        topTeamsList.appendChild(teamCard);
    });

    // Attach click handlers after rendering
    document.querySelectorAll('.select-team-btn').forEach(btn => {
        btn.addEventListener('click', e => {
            const index = e.target.getAttribute('data-index');
            const team = currentDraftOptions[index];
            selectTeam(team);
        });
    });
}
    
        function selectTeam(team) {
            selectedAlliance.push(team);
            if (selectedAlliance.length === 3) {
                showFinalAlliance();
            } else {
                draftNextTeam();

        }

            const topTeamsList = document.getElementById('teams');

            generateOpposingAlliance();

            document.getElementById('reset-button').addEventListener('click', resetAlliance);

        async function showTeamStats(teamKey) {
            const statsContainer = document.getElementById('team-match-stats');
            statsContainer.innerHTML = '<p>Loading team match stats...</p>';
    
            const matchStatsHTML = await getTeamMatchStats(teamKey);
            statsContainer.innerHTML = matchStatsHTML;
    
            document.getElementById('team-info-modal').style.display = 'flex';
        }
    
        async function getTeamMatchStats(teamKey) {
    const nowUnix = Math.floor(Date.now() / 1000);
    const matchStats = [];

    const compLevelMap = {
        'qm': 'Qualification',
        'qf': 'Quarterfinals',
        'sf': 'Semifinals',
        'f': 'Finals'
    };

    try {
        const res = await fetch(`https://www.thebluealliance.com/api/v3/team/${teamKey}/matches/2025/simple`, {
            headers: { 'X-TBA-Auth-Key': apiKey }
        });

        const matches = await res.json();
        const pastMatches = matches.filter(m => m.actual_time && m.actual_time < nowUnix);
        const sortedMatches = pastMatches.sort((a, b) => b.actual_time - a.actual_time).slice(0, 5);

        sortedMatches.forEach(match => {
            const formatTeam = (t, color) => {
                const num = t.replace('frc', '');
                const isSelected = t === teamKey;
                return `<span class="alliance-box ${color}-box${isSelected ? ' selected-team' : ''}">${num}</span>`;
            };

            const redTeams = match.alliances.red.team_keys.map(t => formatTeam(t, 'red')).join(' ');
            const blueTeams = match.alliances.blue.team_keys.map(t => formatTeam(t, 'blue')).join(' ');

            const compLevel = compLevelMap[match.comp_level] || match.comp_level.toUpperCase();

            matchStats.push(`
                <div class="match-stats">
                    <h4 style="color: white;>Match <strong style="color: white;">${compLevel}</strong> ${match.match_number}</h4>
                    <p style="color: white;><strong style="color: white;>Event:</strong> ${match.event_key}</p>
                    <div class="match-details">
                        <div><strong>Red:</strong> ${redTeams} (${match.alliances.red.score})</div>
                        <div><strong>Blue:</strong> ${blueTeams} (${match.alliances.blue.score})</div>
                    </div>
                </div>
            `);
        });

        return `<div class="match-stats-container">${matchStats.length ? matchStats.join('') : "<div>No recent matches found.</div>"}</div>`;
    } catch (err) {
        return `<div class="error-message">Error loading match data: ${err.message}</div>`;
    }
}
    


        function generateOpposingAlliance() {
            // Limit to top 10 teams
            const top50teams = window.allTopTeams.slice(0, 50);

            // Filter out teams already selected by the user
            const remainingTeams = top50teams.filter(team =>
                !selectedAlliance.some(sel => sel.team_number === team.team_number)
            );

            const opposingAlliance = [];
            while (opposingAlliance.length < 3 && remainingTeams.length > 0) {
                const randIndex = Math.floor(Math.random() * remainingTeams.length);
                const team = remainingTeams.splice(randIndex, 1)[0];
                opposingAlliance.push(team);
            }

            // Store it globally so the simulate button can see it
            window.opposingAlliance = opposingAlliance;

            const opposingDiv = document.getElementById('opposing-alliance');
            opposingDiv.innerHTML = `
                <h2>Opposing Alliance:</h2>
                <div class="box-container" id="opposing-box"></div>
            `;

            opposingAlliance.forEach(team => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `
                    <strong>${team.nickname || `Team ${team.team_number}`}</strong> (Team ${team.team_number})
                    <button onclick="showTeamStats('${team.teamKey}')">Show Match Stats</button>
                `;
                document.getElementById('opposing-box').appendChild(card);
            });
        }

            document.getElementById('team-info-modal').style.display = 'none';
            document.getElementById('matchModal').style.display = 'none'; // Close match simulation modal
        }

        function renderSimulateButton() {
            const simulateBtn = document.createElement('button');
            simulateBtn.textContent = "Simulate Match";
            simulateBtn.style.cssText = `
                display: block;
                margin: 30px auto;
                background: #28a745;
                color: white;
                padding: 12px 24px;
                font-size: 16px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
            `;
            simulateBtn.addEventListener('click', async () => {
                if (!selectedAlliance || selectedAlliance.length !== 3 || !window.opposingAlliance || window.opposingAlliance.length !== 3) {
                    alert("Both alliances must be complete before simulation.");
                    return;
                }

                document.getElementById('closeModalBtn').addEventListener('click', closeModal);

                const modal = document.getElementById("matchModal") || createMatchModal();
                const modalContent = document.getElementById("modalContent");
                modalContent.innerHTML = '<h2 style="margin-bottom: 20px; text-align: center;">Predicted Alliance Scores</h2>';

                const allTeams = [...selectedAlliance, ...window.opposingAlliance];

                const teamScores = await Promise.all(allTeams.map(async team => {
                    const match = await getLastMatch(team.teamKey);
                    if (!match) return null;

                    const alliance = match.alliances.red.team_keys.includes(team.teamKey) ? 'red' : 'blue';
                    const score = match.alliances[alliance].score;

                    return {
                        team: team,
                        score
                    };
                }));

                const redTeamData = teamScores.slice(0, 3).filter(t => t && t.score != null);
                const blueTeamData = teamScores.slice(3, 6).filter(t => t && t.score != null);

                const redScores = redTeamData.map(t => t.score);
                const blueScores = blueTeamData.map(t => t.score);

                const avgRed = redScores.length ? (redScores.reduce((a, b) => a + b, 0) / redScores.length).toFixed(1) : 'N/A';
                const avgBlue = blueScores.length ? (blueScores.reduce((a, b) => a + b, 0) / blueScores.length).toFixed(1) : 'N/A';

                const redChance = avgRed !== 'N/A' && avgBlue !== 'N/A' ? (parseFloat(avgRed) / (parseFloat(avgRed) + parseFloat(avgBlue)) * 100).toFixed(1) : 'N/A';
                const blueChance = avgRed !== 'N/A' && avgBlue !== 'N/A' ? (parseFloat(avgBlue) / (parseFloat(avgRed) + parseFloat(avgBlue)) * 100).toFixed(1) : 'N/A';

                // Power score calculation (scale of 1 to 100, divided by 300)
                let powerScore = 'N/A';
                let progressBarColor = 'gray';
                let tooltipText = '';
                let mvpText = '';

                if (avgRed !== 'N/A' && redChance !== 'N/A' && blueChance !== 'N/A') {
                    let baseScore = (parseFloat(avgRed) / 300) * 100;
                    tooltipText += `Base Score: ${(baseScore).toFixed(1)} (from average score / 300)\n`;
                    if (redScores.every(score => score > 80)) {
                        baseScore += 3;
                        tooltipText += `+3 bonus: All team scores > 80\n`;
                    }

                    if (redScores.some(score => score > 120)) {
                        baseScore += 2;
                        tooltipText += `+2 bonus: At least one team scored > 120\n`;
                    }

                    if (parseFloat(avgRed) > parseFloat(avgBlue)) {
                        baseScore += 5;
                        tooltipText += `+5 bonus: Avg Red Score is higher than Avg Blue\n`;
                    }

                    powerScore = parseFloat(Math.min(100, baseScore).toFixed(1));

                    const scoreVal = parseFloat(powerScore);
                    if (scoreVal >= 70) progressBarColor = '#28a745';
                    else if (scoreVal >= 40) progressBarColor = '#ffc107';
                    else progressBarColor = '#dc3545';

                    // MVP
                    const mvp = redTeamData.reduce((max, t) => t.score > max.score ? t : max, redTeamData[0]);
                    if (mvp) {
                        const name = mvp.team.nickname || `Team ${mvp.team.team_number}`;
                        mvpText = `<p style="margin-top: 10px;"><strong>🏅 Team MVP:</strong> ${name} (${mvp.team.team_number}) with ${mvp.score} pts</p>`;
                    }
                }

                // Add tokens for every point above 94
                // Save power score to localStorage if it's higher than the existing score
                const storedScore = parseFloat(localStorage.getItem('score')) || 0;
                if (parseFloat(powerScore) > storedScore) {
                    localStorage.setItem('score', powerScore);
                }

                // Add tokens for every point above 94
                allTeams.forEach(team => {
                    const match = teamScores.find(t => t.team.teamKey === team.teamKey);
                    if (!isNaN(powerScore) && powerScore > 90) {
                        const additionalTokens = Math.round((powerScore - 90) * 10);
                        updateUserTokens(additionalTokens);
                    }
                });

                modalContent.innerHTML += `
                    <div style="text-align: center;">
                        <p><strong>Your Alliance Average Score:</strong> ${avgRed}</p>
                        <p><strong>Opposing Alliance Average Score:</strong> ${avgBlue}</p>
                        <p><strong>Your Alliance Win Probability:</strong> ${redChance}%</p>
                        <p><strong>Opposing Alliance Win Probability:</strong> ${blueChance}%</p>
                        <p style="font-size: 18px; margin-top: 15px;"><strong>Your Alliance Power Score:</strong> ${powerScore}/100</p>
                        <div title="${tooltipText.trim().replace(/\n/g, '&#10;')}" style="margin: 10px auto; width: 80%; height: 25px; background: #eee; border-radius: 15px; overflow: hidden; cursor: help;">
                            <div style="width: ${powerScore}%; height: 100%; background: ${progressBarColor}; transition: width 0.5s;"></div>
                        </div>
                        ${mvpText}
                        <a href="bestallianceleaderboard.html" style="display: inline-block; margin-top: 20px; padding: 12px 24px; background-color: #007bff; color: white; text-decoration: none; border-radius: 8px; font-size: 16px;">Submit Your Score</a>
                    </div>
                `;

                modal.style.display = 'flex';
            });

            document.getElementById('teams').appendChild(simulateBtn);
        }

        async function getLastMatch(teamKey) {
            try {
                const res = await fetch(`https://www.thebluealliance.com/api/v3/team/${teamKey}/matches/2025/simple`, {
                    headers: { 'X-TBA-Auth-Key': apiKey }
                });

                const matches = await res.json();
                const nowUnix = Math.floor(Date.now() / 1000);
                const pastMatches = matches.filter(m => m.actual_time && m.actual_time < nowUnix);

                if (!pastMatches.length) return null;

                const latestMatch = pastMatches.sort((a, b) => b.actual_time - a.actual_time)[0];
                return latestMatch;

            } catch (err) {
                console.error(`Failed to fetch last match for ${teamKey}:`, err);
                return null;
            }
        }
