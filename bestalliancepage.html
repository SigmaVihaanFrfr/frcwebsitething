<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="browserlogo.png">
    <!-- Set web app capable -->
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Set status bar style (optional) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Set the app title when added to Home Screen -->
    <meta name="apple-mobile-web-app-title" content="FRC Alliance Betting">

    <!-- App icon (optional but recommended) -->
    <link rel="apple-touch-icon" href="logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random FRC Teams</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #343a40;
            color: white;
            margin: 0;
            padding: 40px 20px;
        }

        header {
            background-color: #212529;
            padding: 20px;
            text-align: center;
            border-radius: 20px;
        }

        h1 {
            color: #cbcbcb;
        }

        .box-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            background-color: #2c3034;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #e0e0e0;
        }

        .team-card {
            background-color: #575757;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            width: 200px;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .team-card button {
            background: #dc3545;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .team-card button:hover {
            background: #c82333;
        }

        .team-card strong {
            font-size: 1.2em;
        }

        .back-btn {
            display: block;
            margin: 20px auto;
            padding: 10px;
            background: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            width: 200px;
            text-align: center;
        }

        .back-btn:hover {
            background: #c82333;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        li {
            background-color: #575757;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 1.1em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #2c3034;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 800px;
            max-height: 70vh; /* Add this line to limit the height */
            overflow-y: auto; /* Add this line to enable scrolling */
        }

        .close-btn {
            background: #dc3545;
            padding: 10px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            float: right;
        }

        .close-btn:hover {
            background: #c82333;
        }

        .match-stats-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Random Top 100 FRC Teams</h1>
    </header>

    <div class="box-container" id="teams">
        <!-- Teams will be dynamically added here -->
    </div>

    <div id="opposing-alliance" style="margin-top: 20px;">

    </div>

    <!-- Modal for displaying team stats -->
    <div id="team-info-modal" class="modal">
        <div class="modal-content">
            <a href="javascript:void(0)" class="close-btn" onclick="closeModal()">Close</a>
            <div id="team-match-stats"></div>
        </div>
    </div>

    <script>
        const apiKey = '4LGtwcoqrW5HYCVKHzrWGbMdfVirzVrMGmPFL4Mk7d1pCt6s7AjIaixPqLCEU9MN';
        const selectedAlliance = [];
        let currentDraftOptions = [];
    
        async function loadTopTeams() {
            const topTeamsList = document.getElementById('teams');
            topTeamsList.innerHTML = '<div>Loading top teams...</div>';
    
            try {
                const response = await fetch('https://www.thebluealliance.com/api/v3/events/2025/simple', {
                    headers: { 'X-TBA-Auth-Key': apiKey }
                });
    
                const events = await response.json();
                if (!events.length) throw new Error('No events found.');
    
                const rankings = [];
                const selectedEvents = events.slice(0, 5);
    
                for (const event of selectedEvents) {
                    const rankingRes = await fetch(`https://www.thebluealliance.com/api/v3/event/${event.key}/rankings`, {
                        headers: { 'X-TBA-Auth-Key': apiKey }
                    });
                    const rankingData = await rankingRes.json();
    
                    if (rankingData.rankings) {
                        rankingData.rankings.forEach(r => {
                            rankings.push({
                                team_key: r.team_key,
                                qualPoints: r.extra_stats ? r.extra_stats[0] : r.sort_orders?.[0] || 0
                            });
                        });
                    }
                }
    
                const teamStats = {};
                rankings.forEach(({ team_key, qualPoints }) => {
                    if (!teamStats[team_key]) teamStats[team_key] = 0;
                    teamStats[team_key] += qualPoints;
                });
    
                const allSortedTeams = Object.entries(teamStats).sort((a, b) => b[1] - a[1]);
                const top100 = allSortedTeams.slice(0, 100);
    
                const teamDetailMap = {};
                const topTeamDetails = await Promise.all(top100.map(async ([teamKey]) => {
                    const res = await fetch(`https://www.thebluealliance.com/api/v3/team/${teamKey}`, {
                        headers: { 'X-TBA-Auth-Key': apiKey }
                    });
                    const data = await res.json();
                    teamDetailMap[teamKey] = data;
                    return { ...data, teamKey };
                }));
    
                window.allTopTeams = topTeamDetails;
                draftNextTeam();
    
            } catch (error) {
                console.error('Error loading top teams:', error);
                topTeamsList.innerHTML = '<div>Error loading teams. Please try again later.</div>';
            }
        }
    
        function draftNextTeam() {
            const topTeamsList = document.getElementById('teams');
            topTeamsList.innerHTML = '';
    
            const pool = [...window.allTopTeams];
            currentDraftOptions = [];
    
            while (currentDraftOptions.length < 3) {
                const randomIndex = Math.floor(Math.random() * pool.length);
                const randomTeam = pool[randomIndex];
                if (!selectedAlliance.some(t => t.team_number === randomTeam.team_number) &&
                    !currentDraftOptions.includes(randomTeam)) {
                    currentDraftOptions.push(randomTeam);
                }
            }
    
            currentDraftOptions.forEach((team, index) => {
                const teamCard = document.createElement('div');
                teamCard.className = 'team-card';
                teamCard.innerHTML = `
                    <strong>${team.nickname || `Team ${team.team_number}`}</strong> (Team ${team.team_number})
                    <button class="select-team-btn" data-index="${index}">Select Team</button>
                    <button onclick="showTeamStats('${team.teamKey}')">Show Match Stats</button>
                `;
                topTeamsList.appendChild(teamCard);
            });
    
            // Attach click handlers after rendering
            document.querySelectorAll('.select-team-btn').forEach(btn => {
                btn.addEventListener('click', e => {
                    const index = e.target.getAttribute('data-index');
                    const team = currentDraftOptions[index];
                    selectTeam(team);
                });
            });
        }
    
        function selectTeam(team) {
            selectedAlliance.push(team);
            if (selectedAlliance.length === 3) {
                showFinalAlliance();
            } else {
                draftNextTeam();
            }
        }
    
        function showFinalAlliance() {
            const topTeamsList = document.getElementById('teams');
            topTeamsList.innerHTML = `
                <div style="margin-bottom: 10px;">
                    <h2>Your Drafted Alliance:</h2>
                </div>
                <div class="box-container" id="drafted-box"></div>
                <button id="reset-button" style="
                    display: block;
                    margin: 20px auto;
                    background: #ffc107;
                    color: black;
                    padding: 0px 20px;
                    border: none;
                    border-radius: 15px;
                    cursor: pointer;
                    font-weight: bold;
                ">Reset Alliance</button>
            `;

            const draftedBox = document.getElementById('drafted-box');
            selectedAlliance.forEach(team => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `
                    <strong>${team.nickname || `Team ${team.team_number}`}</strong> (Team ${team.team_number})
                    <button onclick="showTeamStats('${team.teamKey}')">Show Match Stats</button>
                `;
                draftedBox.appendChild(card);
            });

            generateOpposingAlliance();
            renderSimulateButton();

            document.getElementById('reset-button').addEventListener('click', resetAlliance);
        }
    
        async function showTeamStats(teamKey) {
            const statsContainer = document.getElementById('team-match-stats');
            statsContainer.innerHTML = '<p>Loading team match stats...</p>';
    
            const matchStatsHTML = await getTeamMatchStats(teamKey);
            statsContainer.innerHTML = matchStatsHTML;
    
            document.getElementById('team-info-modal').style.display = 'flex';
        }
    
        async function getTeamMatchStats(teamKey) {
            const nowUnix = Math.floor(Date.now() / 1000);
            const matchStats = [];
    
            try {
                const res = await fetch(`https://www.thebluealliance.com/api/v3/team/${teamKey}/matches/2025/simple`, {
                    headers: { 'X-TBA-Auth-Key': apiKey }
                });
    
                const matches = await res.json();
                const pastMatches = matches.filter(m => m.actual_time && m.actual_time < nowUnix);
                const sortedMatches = pastMatches.sort((a, b) => b.actual_time - a.actual_time).slice(0, 5);
    
                sortedMatches.forEach(match => {
                    const alliance = match.alliances.red.team_keys.includes(teamKey) ? 'red' : 'blue';
    
                    matchStats.push(`
                        <div class="match-stats">
                            <h4>Match ${match.comp_level.toUpperCase()} ${match.match_number}</h4>
                            <p><strong>Event:</strong> ${match.event_key}</p>
                            <div class="match-details">
                                <div><strong>Red:</strong> ${match.alliances.red.team_keys.map(t => t.replace('frc', '')).join(', ')} (${match.alliances.red.score})</div>
                                <div><strong>Blue:</strong> ${match.alliances.blue.team_keys.map(t => t.replace('frc', '')).join(', ')} (${match.alliances.blue.score})</div>
                            </div>
                        </div>
                    `);
                });
    
                return `<div class="match-stats-container">${matchStats.length ? matchStats.join('') : "<div>No recent matches found.</div>"}</div>`;
            } catch (err) {
                return `<div class="error-message">Error loading match data: ${err.message}</div>`;
            }
        }
    


        function generateOpposingAlliance() {
            const remainingTeams = window.allTopTeams.filter(team =>
                !selectedAlliance.some(sel => sel.team_number === team.team_number)
            );

            const opposingAlliance = [];
            while (opposingAlliance.length < 3 && remainingTeams.length > 0) {
                const randIndex = Math.floor(Math.random() * remainingTeams.length);
                const team = remainingTeams.splice(randIndex, 1)[0];
                opposingAlliance.push(team);
            }

            // Store it globally so the simulate button can see it
            window.opposingAlliance = opposingAlliance;

            const opposingDiv = document.getElementById('opposing-alliance');
            opposingDiv.innerHTML = `
                <h2>Opposing Alliance:</h2>
                <div class="box-container" id="opposing-box"></div>
            `;

            opposingAlliance.forEach(team => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `
                    <strong>${team.nickname || `Team ${team.team_number}`}</strong> (Team ${team.team_number})
                    <button onclick="showTeamStats('${team.teamKey}')">Show Match Stats</button>
                `;
                document.getElementById('opposing-box').appendChild(card);
            });
        }

        function closeModal() {
            document.getElementById('team-info-modal').style.display = 'none';
            document.getElementById('matchModal').style.display = 'none'; // Close match simulation modal
        }

        function renderSimulateButton() {
    const simulateBtn = document.createElement('button');
    simulateBtn.textContent = "Simulate Match";
    simulateBtn.style.cssText = `
        display: block;
        margin: 30px auto;
        background: #28a745;
        color: white;
        padding: 12px 24px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    `;
    simulateBtn.addEventListener('click', async () => {
        if (!selectedAlliance || selectedAlliance.length !== 3 || !window.opposingAlliance || window.opposingAlliance.length !== 3) {
            alert("Both alliances must be complete before simulation.");
            return;
        }

    document.getElementById('closeModalBtn').addEventListener('click', closeModal);

        const modal = document.getElementById("matchModal") || createMatchModal();
        const modalContent = document.getElementById("modalContent");
        modalContent.innerHTML = '<h2 style="margin-bottom: 20px; text-align: center;">Predicted Alliance Scores</h2>'; // Clear previous content

        // Fetch last match scores for all teams
        const allTeams = [...selectedAlliance, ...window.opposingAlliance];

        const teamScores = await Promise.all(allTeams.map(async team => {
            const match = await getLastMatch(team.teamKey);
            if (!match) return null;

            const alliance = match.alliances.red.team_keys.includes(team.teamKey) ? 'red' : 'blue';
            const score = match.alliances[alliance].score;

            return {
                team: team,
                score
            };
        }));

        // Filter valid scores and divide into alliances
        const redScores = teamScores.slice(0, 3).map(t => t?.score).filter(score => score != null);
        const blueScores = teamScores.slice(3, 6).map(t => t?.score).filter(score => score != null);

        const avgRed = redScores.length ? (redScores.reduce((a, b) => a + b, 0) / redScores.length).toFixed(1) : 'N/A';
        const avgBlue = blueScores.length ? (blueScores.reduce((a, b) => a + b, 0) / blueScores.length).toFixed(1) : 'N/A';

        // Calculate win probabilities based on average scores
        const redChance = avgRed !== 'N/A' && avgBlue !== 'N/A' ? (parseFloat(avgRed) / (parseFloat(avgRed) + parseFloat(avgBlue)) * 100).toFixed(1) : 'N/A';
        const blueChance = avgRed !== 'N/A' && avgBlue !== 'N/A' ? (parseFloat(avgBlue) / (parseFloat(avgRed) + parseFloat(avgBlue)) * 100).toFixed(1) : 'N/A';

        modalContent.innerHTML += `
            <div style="text-align: center;">
                <p><strong>Your Alliance Average Score:</strong> ${avgRed}</p>
                <p><strong>Opposing Alliance Average Score:</strong> ${avgBlue}</p>
                <p><strong>Your Alliance Win Probability:</strong> ${redChance}%</p>
                <p><strong>Opposing Alliance Win Probability:</strong> ${blueChance}%</p>
            </div>
        `;

        modal.style.display = 'flex';
    });

    document.getElementById('teams').appendChild(simulateBtn);
}

// Helper to create modal dynamically if it doesn't exist
function createMatchModal() {
    const modal = document.createElement('div');
    modal.id = 'matchModal';
    modal.className = 'modal';
    modal.innerHTML = `
        <div class="modal-content" id="modalContent">
        </div>
        <a href="javascript:void(0)" class="close-btn" onclick="document.getElementById('matchModal').style.display='none'">Close</a>
    `;
    document.body.appendChild(modal);
    return modal;
}


function resetAlliance() {
    location.reload();  // Reloads the current page
}


        async function getLastMatch(teamKey) {
            try {
                const res = await fetch(`https://www.thebluealliance.com/api/v3/team/${teamKey}/matches/2025/simple`, {
                    headers: { 'X-TBA-Auth-Key': apiKey }
                });

                const matches = await res.json();
                const nowUnix = Math.floor(Date.now() / 1000);
                const pastMatches = matches.filter(m => m.actual_time && m.actual_time < nowUnix);

                if (!pastMatches.length) return null;

                const latestMatch = pastMatches.sort((a, b) => b.actual_time - a.actual_time)[0];
                return latestMatch;

            } catch (err) {
                console.error(`Failed to fetch last match for ${teamKey}:`, err);
                return null;
            }
        }
    
        loadTopTeams();
    </script>

    <div id="matchModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
    background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#2c2c2c; padding:30px; border-radius:12px; max-width:800px; width:90%; max-height:80vh; overflow-y:auto; color:#fff; position:relative;">
    <span id="closeModalBtn" style="position:absolute; top:12px; right:16px; font-size:24px; cursor:pointer;">&times;</span>
    <div id="modalContent">
    <!-- Match info will go here -->
    </div>
    </div>
    </div>

</body>
</html>
