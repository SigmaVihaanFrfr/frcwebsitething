<script>
  const params = new URLSearchParams(window.location.search);
  const matchId = params.get("match_id");

  let betAmount = 0;
    document.getElementById("bet-amount-input").addEventListener("input", function(event) {
    const value = event.target.value;

    // Only allow numeric values and update betAmount
    if (/^\d+$/.test(value) || value === "") {
      betAmount = value === "" ? 0 : parseInt(value);
      updatePayoutDisplay(); // Update payout display
    } else {
      // If invalid input, revert to the previous valid amount
      event.target.value = betAmount;
    }
  });
  let tokenAmount = parseInt(localStorage.getItem("tokens"));
  let betsPlaced = {};
  let matchResult = { played: false };
  let lockedBetData = JSON.parse(localStorage.getItem(`locked_bet_${matchId}`)) || null;

  function updateTokenDisplay() {
    document.getElementById("token-count").textContent = tokenAmount;
    localStorage.setItem("tokens", tokenAmount);
  }

  updateTokenDisplay();

  if (!matchId) {
    document.getElementById("match-title").textContent = "No match ID provided.";
  } else {
    fetch(`https://www.thebluealliance.com/api/v3/match/${matchId}?X-TBA-Auth-Key=4LGtwcoqrW5HYCVKHzrWGbMdfVirzVrMGmPFL4Mk7d1pCt6s7AjIaixPqLCEU9MN`)
    .then(response => response.json())
    .then(match => {
      const redScore = match.alliances.red.score;
      const blueScore = match.alliances.blue.score;
      matchResult.redFouls = match.score_breakdown?.red?.foulPoints ?? 0;
      matchResult.blueFouls = match.score_breakdown?.blue?.foulPoints ?? 0;
      const winningAlliance = match.winning_alliance;
      const played = redScore !== -1 && blueScore !== -1;

      matchResult = { redScore, blueScore, winningAlliance, played };

      if (played && !lockedBetData) {
        document.getElementById("bet-container").innerHTML = `
            <p style="color: lightcoral;">This match has already been played. Betting is closed.</p>
        `;
        }

      document.getElementById("match-info").innerHTML = `
        <div class="red-alliance"><h3>Red Alliance</h3><p>Teams: ${match.alliances.red.team_keys.map(t => t.replace("frc", "")).join(", ")}</p><p>Score: ${played ? redScore : "?"}</p></div>
        <div class="blue-alliance"><h3>Blue Alliance</h3><p>Teams: ${match.alliances.blue.team_keys.map(t => t.replace("frc", "")).join(", ")}</p><p>Score: ${played ? blueScore : "?"}</p></div>
      `;

      document.getElementById("betting-section").innerHTML = `
        <div><h3>Bet on Red Alliance Score</h3><button data-bet="red" onclick="placeBet('red', 'over')">Over <div id="redOverPredictionDiv">125</div></button><button data-bet="red" onclick="placeBet('red', 'under')">Under <div id="redUnderPredictionDiv">125</div></button></div>
        <div><h3>Bet on Blue Alliance Score</h3><button data-bet="blue" onclick="placeBet('blue', 'over')">Over <div id="blueOverPredictionDiv">125</div></button><button data-bet="blue" onclick="placeBet('blue', 'under')">Under <div id="blueUnderPredictionDiv">125</div></button></div>
        <div><h3>Bet on Winning Alliance</h3><button data-bet="winner" onclick="placeBet('winner', 'red')">Red</button><button data-bet="winner" onclick="placeBet('winner', 'blue')">Blue</button></div>
        <div><h3>Bet on Total Match Score</h3><button data-bet="total" onclick="placeBet('total', 'over')">Over <div id="totalPredictionDiv">250</div></button><button data-bet="total" onclick="placeBet('total', 'under')">Under <div id="totalPredictionDiv">250</div></button></div>
        <div><h3>Bet on Margin of Victory</h3><button data-bet="margin" onclick="placeBet('margin', 'high')">Margin > 30</button><button data-bet="margin" onclick="placeBet('margin', 'low')">Margin ≤ 30</button></div>
        <div><h3>Bet on Red Alliance Fouls</h3><button data-bet="redFouls" onclick="placeBet('redFouls', 'over')">Over 10</button><button data-bet="redFouls" onclick="placeBet('redFouls', 'under')">Under 10</button></div>
        <div><h3>Bet on Blue Alliance Fouls</h3><button data-bet="blueFouls" onclick="placeBet('blueFouls', 'over')">Over 10</button><button data-bet="blueFouls" onclick="placeBet('blueFouls', 'under')">Under 10</button></div>
      `;

      if (match.videos?.length > 0) {
        document.getElementById("video-container").innerHTML = `<h2>Match Video</h2><iframe src="https://www.youtube.com/embed/${match.videos[0].key}" allowfullscreen></iframe>`;
      } else {
        document.getElementById("video-container").innerHTML = `<p>No video available for this match.</p>`;
      }

      if (lockedBetData) {
        disableBetting();
        document.getElementById("claim-btn").style.display = "inline-block";
        document.getElementById("claim-btn").disabled = false;

        if (played && !lockedBetData.processed) {
            document.getElementById("results-box").innerHTML = `<p style="color: yellow;">Match is complete! Click "Claim Winnings" to see your results.</p>`;
        } else if (played && lockedBetData.processed) {
            document.getElementById("results-box").innerHTML = `<p style="color: lightgreen;">You have already claimed your winnings for this match.</p>`;
        } else {
            document.getElementById("results-box").innerHTML = `<p style="color: yellow;">Bets locked! Match hasn't happened yet. You can still click "Claim Winnings", but results may not be processed yet.</p>`;
        }
}

    });
  }

  function placeBet(type, choice) {
    document.querySelectorAll(`button[data-bet="${type}"]`).forEach(btn => btn.classList.remove("selected"));
    event.target.classList.add("selected");
    betsPlaced[type] = choice;
    document.getElementById("lock-btn").disabled = false;
    document.getElementById("reset-btn").disabled = false;
    updatePayoutDisplay();
}


  function lockBets() {
    const totalBets = Object.keys(betsPlaced).length;
    if (betAmount * totalBets > tokenAmount) return alert("Not enough tokens to lock the bet.");
    tokenAmount -= betAmount * totalBets;
    updateTokenDisplay();

    document.querySelectorAll(".bet-container button").forEach(btn => btn.disabled = true);
        for (let [type, choice] of Object.entries(betsPlaced)) {
        const btn = document.querySelector(`button[data-bet="${type}"][onclick*="'${choice}'"]`);
        if (btn) btn.classList.add("locked-selection");
        }
    document.getElementById("lock-btn").textContent = "Locked";
    document.getElementById("lock-btn").disabled = true;

    lockedBetData = { bets: betsPlaced, amount: betAmount, processed: false };
    localStorage.setItem(`locked_bet_${matchId}`, JSON.stringify(lockedBetData));

    document.getElementById("results-box").innerHTML = `<p style="color: yellow;">Bets locked! Match hasn't happened yet. Come back later to claim winnings.</p>`;
  }

  async function claimWinnings() {
    if (!lockedBetData) {
        alert("No locked bet data found for this match.");
        return;
    }

    if (lockedBetData.processed) {
        alert("You’ve already claimed your winnings for this match.");
    }

    // Check if the match has been played before allowing claims
    if (!matchResult.played) {
        alert("The match hasn't been played yet. You can claim winnings after the match is complete.");
        return;
    }

    // Log to check the values
    console.log("Locked Bet Data: ", lockedBetData);
    console.log("Match Result: ", matchResult);
    
    // Fetch the prediction data before proceeding with evaluation
    await fetchPredictionData(); // Wait for the prediction data to be fetched

    betsPlaced = lockedBetData.bets;
    betAmount = lockedBetData.amount;

    const results = evaluateBets(); // Now that prediction data is available, we can evaluate the bets
    
    // Log the results
    console.log("Bet Results: ", results);

    document.getElementById("results-box").innerHTML = results.summary;

    if (results.correctCount > 0) {
        const winnings = betAmount * 2 * results.correctCount;
        tokenAmount += winnings;
        alert(`You won ${results.correctCount} bet(s)! You earned ${winnings} tokens.`);
    } else {
        alert("You lost all your bets. Better luck next time.");
    }

    updateTokenDisplay();
    lockedBetData.processed = true;
    localStorage.setItem(`locked_bet_${matchId}`, JSON.stringify(lockedBetData));
    document.getElementById("claim-btn").style.display = "none";
}


let predictionData = {}; // Declare a global variable to store prediction data

// Fetch prediction data and then call evaluateBets
async function fetchPredictionData() {
  predictionData = await predictScores();
  evaluateBets(); // Now that prediction data is available, evaluate bets
}

// The evaluateBets function
function evaluateBets() {
  
  const redPredict = (Math.round(predictionData.rawAvgRed / 5) * 5 - 10);
  const bluePredict = (Math.round(predictionData.rawAvgBlue / 5) * 5 - 10);
  const totalPredictionValue = redPredict + bluePredict;

  let correctCount = 0;
  let summary = `<h3>Bet Results:</h3><ul style="text-align:left; display:inline-block;">`;

  for (let [type, choice] of Object.entries(betsPlaced)) {
    let outcome = false;
    let message = "";

    switch (type) {
      case "winner":
        outcome = choice === matchResult.winningAlliance;
        message = `You picked ${choice} to win. Actual: ${matchResult.winningAlliance}`;
        break;
      case "red":
        outcome = choice === (matchResult.redScore > redPredict ? "over" : "under");
        message = `Red = ${matchResult.redScore} → ${choice.toUpperCase()} ${redPredict}`;
        break;
      case "blue":
        outcome = choice === (matchResult.blueScore > bluePredict ? "over" : "under");
        message = `Blue = ${matchResult.blueScore} → ${choice.toUpperCase()} ${bluePredict}`;
        break;
      case "total":
        const total = matchResult.redScore + matchResult.blueScore;
        outcome = choice === (total > totalPredictionValue ? "over" : "under");
        message = `Total = ${total} → ${choice.toUpperCase()} ${totalPredictionValue}`;
        break;
      case "margin":
        const margin = Math.abs(matchResult.redScore - matchResult.blueScore);
        outcome = choice === (margin > 30 ? "high" : "low");
        message = `Margin = ${margin} → ${choice === "high" ? "> 30?" : "≤ 30?"}`;
        break;
      case "redFouls":
        const redFouls = matchResult.redFouls ?? 0;
        outcome = choice === (redFouls > 10 ? "over" : "under");
        message = `Red Fouls = ${redFouls} → ${choice.toUpperCase()} 10?`;
        break;

      case "blueFouls":
        const blueFouls = matchResult.blueFouls ?? 0;
        outcome = choice === (blueFouls > 10 ? "over" : "under");
        message = `Blue Fouls = ${blueFouls} → ${choice.toUpperCase()} 10?`;
        break;

      case "tie":
        const isTie = matchResult.redScore === matchResult.blueScore;
        outcome = (choice === "yes" && isTie) || (choice === "no" && !isTie);
        message = `Tie Match? → You picked ${choice.toUpperCase()}, Actual: ${isTie ? "YES" : "NO"}`;
        break;
    }

    summary += `<li>${message} — <strong style="color:${outcome ? 'lightgreen' : 'salmon'}">${outcome ? 'Correct' : 'Wrong'}</strong></li>`;
    if (outcome) correctCount++;
  }

  summary += "</ul>";
  return { correctCount, summary };
}

  function resetBets() {
    document.querySelectorAll(".bet-container button").forEach(btn => {
        btn.classList.remove("selected");
        btn.disabled = false;
    });
    document.getElementById("lock-btn").disabled = true;
    document.getElementById("reset-btn").disabled = true;
    betsPlaced = {};
    updatePayoutDisplay(); // 👈 Add this
}


  function changeBetAmount(amount) {
    betAmount = Math.max(0, betAmount + amount);
    document.getElementById("bet-amount-input").value = betAmount;
    updatePayoutDisplay(); // 👈 Add this
    }


  function disableBetting() {
    document.querySelectorAll(".bet-container button").forEach(btn => btn.disabled = true);
    document.querySelectorAll(".bet-container button").forEach(btn => {
        btn.disabled = true;
        const type = btn.getAttribute("data-bet");
        const isSelected = lockedBetData?.bets?.[type] && btn.outerHTML.includes(`'${lockedBetData.bets[type]}'`);
        if (isSelected) btn.classList.add("locked-selection");
        });
    document.getElementById("reset-btn").disabled = true;
    document.getElementById("lock-btn").disabled = true;
    document.getElementById("bet-amount-input").disabled = true;
    document.querySelectorAll(".bet-amount button").forEach(btn => btn.disabled = true);
  }

  function loadBetsDashboard() {
  const container = document.getElementById("bets-dashboard");
  let content = "<ul style='text-align:left; display:inline-block;'>";

  for (let key in localStorage) {
    if (key.startsWith("locked_bet_")) {
      const matchKey = key.replace("locked_bet_", "");

          <strong>Amount:</strong> ${data.amount} tokens each<br>
          <strong>Status:</strong> ${status}<br>
          <a href="templatepage2.html?match_id=${matchKey}" style="color:#0dcaf0;">Go to Match</a>
          <hr>
        </li>
      `;

  content += "</ul>";

}

function updatePayoutDisplay() {
  const betCount = Object.keys(betsPlaced).length;
  const potentialPayout = betAmount * 2 * betCount;
  document.getElementById("payout-display").textContent = `Total Possible Payout: ${potentialPayout} tokens`;
}

  loadBetsDashboard();


  const TBA_AUTH_KEY = '4LGtwcoqrW5HYCVKHzrWGbMdfVirzVrMGmPFL4Mk7d1pCt6s7AjIaixPqLCEU9MN'; // Replace with your TBA key

  async function predictScores() {
  const matchKey = params.get("match_id");
  const resultsDiv = document.getElementById('results');
  const nowUnix = Math.floor(Date.now() / 1000);

  try {
    const matchRes = await fetch(`https://www.thebluealliance.com/api/v3/match/${matchKey}?X-TBA-Auth-Key=4LGtwcoqrW5HYCVKHzrWGbMdfVirzVrMGmPFL4Mk7d1pCt6s7AjIaixPqLCEU9MN`);
    if (!matchRes.ok) throw new Error("Invalid match key or match not found.");
    const matchData = await matchRes.json();

    const eventKey = matchData.event_key;
    const year = matchKey.substring(0, 4);
    const alliances = matchData.alliances;

    let redScores = [];
    let blueScores = [];

    for (const color of ['red', 'blue']) {
      for (const teamKey of alliances[color].team_keys) {
        let scores = [];

        // Try from this event first
        const eventMatchesRes = await fetch(`https://www.thebluealliance.com/api/v3/team/${teamKey}/event/${eventKey}/matches/simple?X-TBA-Auth-Key=4LGtwcoqrW5HYCVKHzrWGbMdfVirzVrMGmPFL4Mk7d1pCt6s7AjIaixPqLCEU9MN`);

        if (eventMatchesRes.ok) {
          const matches = await eventMatchesRes.json();
          const past = matches.filter(m => m.actual_time && m.actual_time < nowUnix);
          const sorted = past.sort((a, b) => b.actual_time - a.actual_time).slice(0, 3);

          for (const match of sorted) {
            const teamAlliance = match.alliances.red.team_keys.includes(teamKey) ? 'red' : 'blue';
            scores.push(match.alliances[teamAlliance].score);
          }
        }

        // Fallback to full season
        if (scores.length < 3) {
          const seasonMatchesRes = await fetch(`https://www.thebluealliance.com/api/v3/team/${teamKey}/matches/${year}/simple?X-TBA-Auth-Key=4LGtwcoqrW5HYCVKHzrWGbMdfVirzVrMGmPFL4Mk7d1pCt6s7AjIaixPqLCEU9MN`);

          if (seasonMatchesRes.ok) {
            const matches = await seasonMatchesRes.json();
            const past = matches.filter(m => m.actual_time && m.actual_time < nowUnix);
            const sorted = past.sort((a, b) => b.actual_time - a.actual_time);

            for (const match of sorted) {
              if (scores.length >= 3) break;
              const teamAlliance = match.alliances.red.team_keys.includes(teamKey) ? 'red' : 'blue';
              scores.push(match.alliances[teamAlliance].score);
            }
          }
        }

        if (color === 'red') redScores.push(...scores);
        else blueScores.push(...scores);
      }
    }

    const rawAvgRed = redScores.length ? redScores.reduce((a, b) => a + b) / redScores.length : null;
    const rawAvgBlue = blueScores.length ? blueScores.reduce((a, b) => a + b) / blueScores.length : null;

    const avgRed = rawAvgRed !== null ? rawAvgRed.toFixed(1) : "N/A";
    const avgBlue = rawAvgBlue !== null ? rawAvgBlue.toFixed(1) : "N/A";

    resultsDiv.innerHTML = `
      <div class="score-box red">
        <h2>Red Alliance Prediction:</h2>
        <strong>Avg Score:</strong> ${avgRed}
      </div>
      <div class="score-box blue">
        <h2>Blue Alliance Prediction:</h2>
        <strong>Avg Score:</strong> ${avgBlue}
      </div>
      <a class="predict-btn" href="predictionspage.html?matchId=${matchKey}">View More Prediction Info</a>
    `;

    // Return both formatted and raw values
    return {
      avgRed,        // formatted string (e.g., "123.4")
      avgBlue,
      rawAvgRed,     // raw number (e.g., 123.38)
      rawAvgBlue
    };

  } catch (err) {
    return {
      avgRed: "N/A",
      avgBlue: "N/A",
      rawAvgRed: 150,
      rawAvgBlue: 150
    };
  }
}

async function updateRedUnderAllianceScore() {
  const predictions = await predictScores(); // Get the predicted scores

  // Round the Blue Alliance avg score to the nearest 5
  const roundedAvgRed = Math.round(predictions.avgRed / 5) * 5 - 10;

  // Get the div where you want to update the Blue Alliance score
  const predictionDiv = document.getElementById('redUnderPredictionDiv');

  // Replace the content of the div with the rounded Blue Alliance avg score
  predictionDiv.innerHTML = `${roundedAvgRed}`;
}

async function updateTotalScore() {
  const predictions = await predictScores(); // Get the predicted scores

  // Round the Blue Alliance avg score to the nearest 5
  const roundedTotalAvg = ((Math.round(predictions.avgRed / 5) * 5 - 10) + (Math.round(predictions.avgBlue / 5) * 5 - 10));

  // Get the div where you want to update the Blue Alliance score
  const totalPredictionDiv = document.getElementById('totalPredictionDiv');

  // Replace the content of the div with the rounded Blue Alliance avg score
  totalPredictionDiv.innerHTML = `${roundedTotalAvg}`;
}

updateBlueOverAllianceScore();
updateRedOverAllianceScore();
updateBlueUnderAllianceScore();
updateRedUnderAllianceScore();
updateTotalScore();
</script>
